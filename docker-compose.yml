services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: signalyze-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://signalyze-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: signalyze-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: signalyze-kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka

  redis:
    image: redis:7-alpine
    container_name: signalyze-redis
    ports:
      - "6379:6379"

  ingest-service:
    build: ./services/ingest-service
    container_name: signalyze-ingest
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: signalyze-kafka:29092
      SPRING_DATA_REDIS_HOST: signalyze-redis
    depends_on:
      - kafka
      - redis

  processing-service:
    build: ./services/processing-service
    container_name: signalyze-processing
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: signalyze-kafka:29092
      SPRING_DATA_REDIS_HOST: signalyze-redis
      MONGODB_URI: ${MONGODB_URI}
    depends_on:
      - kafka
      - redis

  query-service:
    build: ./services/query-service
    container_name: signalyze-query
    ports:
      - "8083:8083"
    environment:
      SPRING_DATA_REDIS_HOST: signalyze-redis
      MONGODB_URI: ${MONGODB_URI}
    depends_on:
      - redis