global:
  scrape_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: 'signalyze'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'signalyze-auth:8084'
          - 'signalyze-ingest:8081'
          - 'signalyze-processing:8082'
          - 'signalyze-query:8083'
