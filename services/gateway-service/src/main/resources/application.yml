server:
  port: 8085

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Upload is the only POST /documents — send it to ingest (must precede the query route)
        - id: ingest-upload
          uri: http://signalyze-ingest:8081
          predicates:
            - Path=/documents
            - Method=POST
        # Everything else under /documents (list, get, delete, status, chat, ask, streams, file) -> query
        - id: query
          uri: http://signalyze-query:8083
          predicates:
            - Path=/documents/**
        # Auth
        - id: auth
          uri: http://signalyze-auth:8084
          predicates:
            - Path=/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
