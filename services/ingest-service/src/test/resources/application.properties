# Test-only config (shadows the main file): self-contained so the Spring context
# loads without real infrastructure. Dummy secrets; Mongo/Redis/Kafka connect lazily.
spring.application.name=ingest-service

spring.data.mongodb.uri=mongodb://localhost:27017/signalyze-test
spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Keep the outbox relay from firing during the brief context-load test
outbox.relay.initial-delay-ms=600000
outbox.relay.poll-interval-ms=600000
