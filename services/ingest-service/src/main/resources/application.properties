spring.application.name=ingest-service
server.port=8081
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.data.redis.host=localhost
spring.data.redis.port=6379
jwt.secret=${JWT_SECRET}
spring.data.mongodb.uri=${MONGODB_URI}

# Observability: surface correlation id + job id on every log line
logging.pattern.level=%5p [%X{correlationId:-}] [%X{jobId:-}]

# Observability: expose health + Prometheus metrics, tagged per service
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Transactional outbox
spring.data.mongodb.auto-index-creation=true
outbox.relay.poll-interval-ms=2000
