spring.application.name=processing-service
server.port=8082
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=processing-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.signalyze.processing.event.DocumentUploaded
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.config.import=optional:file:./secrets.properties
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.main.web-application-type=servlet
openai.api-key=${OPENAI_API_KEY}
openai.model=gpt-4o-mini
openai.base-url=https://api.openai.com/v1
openai.embedding-model=text-embedding-3-small
# Observability: surface correlation id + job id on every log line
logging.pattern.level=%5p [%X{correlationId:-}] [%X{jobId:-}]

# Observability: expose health + Prometheus metrics, tagged per service
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
