# Test-only config (shadows the main file): fully self-contained so the Spring
# context loads without real infrastructure. Dummy secrets, Kafka listeners off.
spring.application.name=processing-service
spring.main.web-application-type=none

spring.data.mongodb.uri=mongodb://localhost:27017/signalyze-test
spring.data.redis.host=localhost
spring.data.redis.port=6379

openai.api-key=test-key
openai.model=gpt-4o-mini
openai.base-url=https://api.openai.com/v1
openai.embedding-model=text-embedding-3-small

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=processing-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.signalyze.processing.event.DocumentUploaded
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.listener.auto-startup=false
