spring.application.name=auth-service
server.port=8084
spring.config.import=optional:file:./secrets.properties
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Observability: surface correlation id + job id on every log line
logging.pattern.level=%5p [%X{correlationId:-}] [%X{jobId:-}]

# Observability: expose health + Prometheus metrics, tagged per service
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Refresh tokens (7 days) + index creation for the TTL and unique-email indexes
jwt.refresh-expiration-ms=604800000
spring.data.mongodb.auto-index-creation=true
