# Test-only config (shadows the main file): fully self-contained so the Spring
# context loads without real infrastructure. Dummy secrets, Kafka listeners off.
spring.application.name=query-service

spring.data.mongodb.uri=mongodb://localhost:27017/signalyze-test
spring.data.redis.host=localhost
spring.data.redis.port=6379

openai.api-key=test-key
openai.model=gpt-4o-mini
openai.base-url=https://api.openai.com/v1
openai.embedding-model=text-embedding-3-small

jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=query-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.auto-startup=false
