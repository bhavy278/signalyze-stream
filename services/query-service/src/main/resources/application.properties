spring.application.name=query-service
server.port=8083
spring.config.import=optional:file:./secrets.properties
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
openai.api-key=${OPENAI_API_KEY}
openai.model=gpt-4o-mini
openai.base-url=https://api.openai.com/v1
openai.embedding-model=text-embedding-3-small
jwt.secret=${JWT_SECRET}
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=query-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Observability: surface correlation id + job id on every log line
logging.pattern.level=%5p [%X{correlationId:-}] [%X{jobId:-}]

# Observability: expose health + Prometheus metrics, tagged per service
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
